name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_DLMS_BUILD_TESTS=ON \
            -DOPEN_DLMS_BUILD_SERVER=ON \
            -DOPEN_DLMS_BUILD_CLIENT=ON \
            -DOPEN_DLMS_BUILD_METER_SIM=ON \
            -DOPEN_DLMS_BUILD_READER_LAB=ON \
            -DCOSEMLIB_SHARED=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Install
        run: cmake --install build --prefix ${{ github.workspace }}/install

      - name: Validate installed CMake package
        run: |
          mkdir -p consumer-cmake
          cat > consumer-cmake/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(opendlms_consumer C)
          find_package(OpenDLMS REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer OpenDLMS::opendlms_reader)
          EOF
          cat > consumer-cmake/main.c <<'EOF'
          #include <opendlms_reader.h>
          int main(void) { opendlms_reader_t reader; csm_asso_config asso; return opendlms_reader_init(&reader, &asso, 1) == 0 ? 0 : 1; }
          EOF
          cmake -S consumer-cmake -B consumer-cmake/build -G Ninja \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build consumer-cmake/build

      - name: Validate installed pkg-config package
        run: |
          cat > consumer-pkg.c <<'EOF'
          #include <cosemlib.h>
          #include <csm_transport_tcp.h>
          int main(void) { csm_transport transport; (void)transport; return 0; }
          EOF
          PKG_CONFIG_PATH=${{ github.workspace }}/install/lib/pkgconfig \
            cc consumer-pkg.c $(PKG_CONFIG_PATH=${{ github.workspace }}/install/lib/pkgconfig pkg-config --cflags --libs opendlms) \
            -o consumer-pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/cosemlib/libcosemlib.a
            build/client/libopendlms_reader.a
            ${{ github.workspace }}/install/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: lukka/get-cmake@latest

      - name: Configure (MSVC)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DOPEN_DLMS_BUILD_TESTS=ON `
            -DOPEN_DLMS_BUILD_SERVER=ON `
            -DOPEN_DLMS_BUILD_CLIENT=ON `
            -DOPEN_DLMS_BUILD_METER_SIM=ON `
            -DOPEN_DLMS_BUILD_READER_LAB=ON `
            -DCOSEMLIB_SHARED=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/**/Release/cosemlib.lib
            build/**/Release/opendlms_reader.lib
            build/**/Release/metersimulator.exe
            build/**/Release/reader_lab.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_DLMS_BUILD_TESTS=ON \
            -DOPEN_DLMS_BUILD_SERVER=ON \
            -DCOSEMLIB_SHARED=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/cosemlib/libcosemlib.a

  # Electron studio build (Linux only for now)
  build-studio:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Install npm dependencies
        working-directory: electron-studio
        run: npm ci

      - name: Build native addon
        working-directory: electron-studio
        run: npm run build:native

      - name: Run native addon tests
        working-directory: electron-studio
        run: npm test

      - name: Package
        working-directory: electron-studio
        run: npx electron-builder --linux --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
